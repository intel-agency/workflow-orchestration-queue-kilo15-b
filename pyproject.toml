[project]
# Project metadata
name = "workflow-orchestration-queue"
version = "0.1.0"
description = "Headless agentic orchestration platform for GitHub workflow automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Intel Agency", email = "noreply@intel-agency.dev" }
]
keywords = ["orchestration", "automation", "github", "workflow", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

# Core dependencies - Production runtime requirements
# FastAPI: Modern async web framework for building APIs
# Uvicorn: ASGI server for running FastAPI applications
# Pydantic: Data validation and settings management using Python type hints
# httpx: Modern async HTTP client for GitHub API interactions
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
]

# Development dependencies - Testing, linting, and development tools
# pytest: Testing framework with plugin ecosystem
# pytest-asyncio: Async test support for pytest
# ruff: Fast Python linter and formatter (replaces flake8, black, isort)
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/intel-agency/workflow-orchestration-queue-kilo15-b"
Repository = "https://github.com/intel-agency/workflow-orchestration-queue-kilo15-b"
Documentation = "https://github.com/intel-agency/workflow-orchestration-queue-kilo15-b#readme"
Issues = "https://github.com/intel-agency/workflow-orchestration-queue-kilo15-b/issues"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

# Ruff configuration - Fast linter and formatter
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# Exclude external-generated and non-project directories from linting
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "plan_docs",      # External-generated documents
    "scripts",        # Legacy scripts (not part of core package)
    "test",           # Shell test directory (not Python)
    ".agents",
    ".opencode",
    ".kilocode",
    ".qwen",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["workflow_orchestration_queue"]

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
