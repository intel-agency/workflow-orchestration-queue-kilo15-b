[project]
name = "workflow-orchestration-queue"
version = "0.1.0"
description = "OS-APOW: Headless agentic orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
sentinel = "workflow_orchestration_queue.sentinel:main"
notifier = "workflow_orchestration_queue.notifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_orchestration_queue"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["plan_docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["workflow_orchestration_queue"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
